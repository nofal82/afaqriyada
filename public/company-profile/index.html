<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afaq Riyada Solutions – Company Profile</title>
<style>
:root{--o:#0A5684;--n:#102e44;--t:#1ba3c2;--l:#edf4f7;--g:#4b5d6b;--bg:#d5dee4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1620}}
:root[data-theme="dark"]{--bg:#0b1620}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;user-select:none}
#wrap{position:relative}
#stage{width:600px;height:848px;position:absolute;left:0;top:0;transform-origin:0 0;perspective:2600px;cursor:pointer}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.55,0,.25,1),visibility 0s}
.leaf.f{transform:rotateY(-180deg);visibility:hidden;transition:transform 1.1s cubic-bezier(.55,0,.25,1),visibility 0s 1.1s}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,0) 7%)}
.back{transform:rotateY(180deg);background:linear-gradient(270deg,#f3f6f8,#dfe7ec)}
.pg{position:absolute;inset:0;color:var(--n)}
.hd{background:var(--o);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;color:#fff}
.wm{font-weight:700;letter-spacing:4px;font-size:19px}
.hd small{font-size:10px;letter-spacing:1px;opacity:.85}
.body{padding:34px 40px 0}
.ey{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--o);text-transform:uppercase}
h1{font-size:34px;margin:8px 0 6px;color:var(--n)}
h2{font-size:22px;margin:0 0 14px}
.sub{font-size:14px;color:var(--g);margin:0 0 22px}
.ft{position:absolute;left:40px;right:40px;bottom:22px;border-top:1px solid #cfdae1;padding-top:9px;display:flex;justify-content:space-between;font-size:9.5px;color:var(--g);letter-spacing:.5px}
.ft b{color:var(--o);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--l);border-top:3px solid var(--t)}
.card .ch{background:var(--o);color:#fff;padding:9px 12px}
.card .ch b{font-size:12.5px;letter-spacing:.5px;display:block}
.card .ch i{font-style:normal;font-size:9px;opacity:.8;letter-spacing:1px}
.cb{padding:10px 12px 10px;height:196px;position:relative}
.cb h3{font-size:13.5px;margin:0 0 4px;color:var(--o)}
.cb p{font-size:11px;line-height:1.4;color:var(--g);margin:0 0 7px}
.cb ul{margin:0;padding:0;list-style:none}
.cb li{font-size:11px;line-height:1.55;padding-left:12px;position:relative}
.cb li::before{content:"";position:absolute;left:0;top:6px;width:5px;height:5px;background:var(--t)}
.cb u{text-decoration:none;position:absolute;bottom:8px;left:12px;font-size:10px;color:var(--o)}
.note{position:absolute;left:40px;bottom:50px;font-size:9px;color:var(--g)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 26px}
.box{background:var(--l);padding:18px}
.box b{color:var(--t);font-size:12px}.box h3{margin:8px 0;font-size:17px}.box p{margin:0;font-size:12px;line-height:1.5;color:var(--g)}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
.four div{border-top:3px solid var(--t);padding-top:9px}
.four b{color:var(--o);font-size:11px}.four h4{margin:6px 0;font-size:15px}.four p{margin:0;font-size:11px;line-height:1.4;color:var(--g)}
.dark{background:var(--n);color:#fff;padding:20px 24px}.dark h3{margin:0 0 8px;font-size:17px}.dark p{margin:0;font-size:12.5px;line-height:1.5;color:#cfe0ea}
.bar{border-left:4px solid var(--t);padding:2px 0 2px 14px;margin-bottom:18px}.bar h3{margin:0 0 4px;font-size:16px}.bar p{margin:0;font-size:12.5px;color:var(--g)}
#ctl{display:flex;gap:14px;align-items:center;margin-top:10px;color:var(--n)}
#ctl button{border:0;background:var(--o);color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}
#ctl button:disabled{opacity:.35;cursor:default}
#ctl span{font-size:13px;min-width:60px;text-align:center;color:var(--g)}
</style><style>
:root{--n:#0A5684;--t:#a9c1d6;--l:#eef3f7}
#stage{width:1200px;transition:transform 1.1s cubic-bezier(.55,0,.25,1)}
.leaf{inset:auto;left:600px;top:0;width:600px;height:848px}
.leaf.f{visibility:visible;transition:transform 1.1s cubic-bezier(.55,0,.25,1)}
.back{background:#fff}
.back::after{background:linear-gradient(270deg,rgba(0,0,0,.22),rgba(0,0,0,0) 7%)}
.card{border-top:0;border-left:4px solid var(--o)}
.four div{border-top-color:var(--o)}.bar{border-left-color:var(--o)}.box b{color:var(--o)}
.cb li::before{background:var(--o)}
.card .ch{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px;padding:6px 10px 6px 12px}
.lg{background:#fff;width:96px;height:38px;display:flex;align-items:center;justify-content:center;flex:none}
.lg img{max-width:88px;max-height:32px}
.dark{background:var(--o)}
</style></head><body>
